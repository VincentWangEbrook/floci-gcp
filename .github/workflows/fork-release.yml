name: Fork Release

on:
  push:
    tags:
      - 'fork-v*'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - name: Validate immutable fork release tag
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^fork-v([0-9]+\.[0-9]+\.[0-9]+)-shophub\.([0-9]+)$ ]]; then
            echo "Expected fork-v<upstream-version>-shophub.<patch>; got $tag" >&2
            exit 1
          fi
          echo "image_tag=${BASH_REMATCH[1]}-shophub.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

  build-native-amd64:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mvn clean package -Dnative -DskipTests -B -Dquarkus.native.additional-build-args-append="-march=x86-64-v2"
      - uses: actions/upload-artifact@v7
        with:
          name: native-amd64
          path: |
            target/*-runner
            target/*.properties
            target/*.so
          retention-days: 1

  build-native-arm64:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: graalvm/setup-graalvm@0def53c0fd8534bc13416c9469f5be45265824fd # v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          cache: maven
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: mvn clean package -Dnative -DskipTests -B
      - uses: actions/upload-artifact@v7
        with:
          name: native-arm64
          path: |
            target/*-runner
            target/*.properties
            target/*.so
          retention-days: 1

  publish:
    needs: [prepare, build-native-amd64, build-native-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: native-amd64
          path: native/amd64/
      - uses: actions/download-artifact@v8
        with:
          name: native-arm64
          path: native/arm64/
      - name: Stage native binaries
        run: |
          for arch in amd64 arm64; do
            mv native/$arch/*-runner native/$arch/application
          done
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable native image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.native-package
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/floci-gcp:${{ needs.prepare.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/floci-gcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
